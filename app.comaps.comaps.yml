app-id: app.comaps.comaps
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: CoMaps
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --system-talk-name=org.freedesktop.GeoClue2.*

cleanup:
  - '*.a'
  - '/include'

modules:
  - name: optipng
    cleanup:
      - '*'
    sources:
     - type: archive
       url: https://prdownloads.sourceforge.net/optipng/optipng-7.9.1.tar.gz
       sha256: c2579be58c2c66dae9d63154edcb3d427fef64cb00ec0aff079c9d156ec46f29

  - name: python-protobuf
    buildsystem: simple
    cleanup:
      - '*'
    build-commands:
      - pip3 install --no-index --no-build-isolation --prefix="${FLATPAK_DEST}" .
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/55/5b/e3d951e34f8356e5feecacd12a8e3b258a1da6d9a03ad1770f28925f29bc/protobuf-3.20.3.tar.gz
        sha256: 2e3427429c9cffebf259491be0af70189607f365c2f41c7c3764af6f337105f2

  - name: comaps
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSKIP_TESTS=1
      - -DSKIP_TOOLS=1
    post-install:
      - mkdir -p "${FLATPAK_DEST}/share/comaps/data/world_mwm/260603"
      - install -Dm644 "../data/world_mwm/260603/WorldCoasts.mwm" "${FLATPAK_DEST}/share/comaps/data/world_mwm/260603/"
      - install -Dm644 "../data/world_mwm/260603/World.mwm" "${FLATPAK_DEST}/share/comaps/data/world_mwm/260603/"
      - install -Dm644 "../qt/res/logo.png" "${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png"
      - install -Dm644 "../qt/res/logo-scalable.svg" "${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg"
      - install -Dm644 "../data/categories_brands.txt" "${FLATPAK_DEST}/share/comaps/data/"
      - desktop-file-edit "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop" --set-icon=${FLATPAK_ID}
    sources:
      - type: git
        url: https://codeberg.org/comaps/comaps
        commit: ec9e508da4fd6a068d5ade9aeec294ff20b36e24
        tag: v2026.06.05-11
      - type: file
        url: https://cdn-fi-1.comaps.app/maps/260603/World.mwm
        sha256: 3c186fc099f0e123bb384a6bf61764abae5c4c2aa9e7cec7592f1a2abdb404c2
        dest: data/world_mwm/260603/
      - type: file
        url: https://cdn-fi-1.comaps.app/maps/260603/WorldCoasts.mwm
        sha256: fac2be39dda3ff223045dacddef71bae2b68ff5a162a6aebc161e1e1a63598d1
        dest: data/world_mwm/260603/
      - type: shell
        commands:
          - ./configure.sh
